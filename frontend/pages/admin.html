<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/admin.css">
</head>

<body>
    <header>
        <h1>⚙️ Painel Administrativo</h1>
        <a onclick="logout()" class="btn-sair">Sair</a>
    </header>
    <div class="container">
        <div class="card-novo">
            <h2>Novo Produto</h2>
            <div class="form-row">
                <input type="text" id="nome" placeholder="Nome do Produto">
                <input type="number" id="preco" placeholder="Preço" step="0.01">
                <input type="number" id="qtd" placeholder="Qtd">
                <select id="categoria">
                    <option value="CAMISETA">Camisetas</option>
                    <option value="ACESSORIO">Acessórios</option>
                    <option value="CALCADO">Calçados</option>
                    <option value="PERFUME">Perfumes</option>
                </select>
                <button class="btn-add" onclick="cadastrarProduto()">+ Adicionar</button>
            </div>
        </div>
        <div id="listas-produtos">
            <p style="text-align:center;">Carregando...</p>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>

</html>
